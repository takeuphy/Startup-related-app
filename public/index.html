<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startup Legal Summarizer - 米国スタートアップ法務情報</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>Startup Legal Summarizer</h1>
      <p class="subtitle">米国スタートアップ法務情報を日本語で要約</p>
    </div>
  </header>

  <main class="container">
    <!-- 統計情報 -->
    <section class="stats-section">
      <div class="stats" id="stats">
        <div class="stat-card">
          <span class="stat-value" id="articleCount">-</span>
          <span class="stat-label">収集記事</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="summaryCount">-</span>
          <span class="stat-label">要約済み</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="unsummarizedCount">-</span>
          <span class="stat-label">未処理</span>
        </div>
      </div>
    </section>

    <!-- アクションボタン -->
    <section class="actions-section">
      <button id="fetchBtn" class="btn btn-primary">
        <span class="btn-icon">📥</span>
        記事を収集
      </button>
      <button id="summarizeBtn" class="btn btn-secondary">
        <span class="btn-icon">📝</span>
        要約を実行
      </button>
      <button id="refreshBtn" class="btn btn-outline">
        <span class="btn-icon">🔄</span>
        更新
      </button>
    </section>

    <!-- ステータスメッセージ -->
    <div id="status" class="status hidden"></div>

    <!-- カテゴリフィルター -->
    <section class="filter-section">
      <label for="categoryFilter">カテゴリ:</label>
      <select id="categoryFilter">
        <option value="">すべて</option>
        <optgroup label="政府・規制">
          <option value="government-legislation">法令・規則・パブリックコメント</option>
          <option value="securities-finance">会社・資金調達・証券規制</option>
          <option value="tax-accounting">税務・会計</option>
          <option value="labor-employment">労務・雇用</option>
          <option value="privacy-cyber">プライバシー・サイバー</option>
          <option value="immigration">移民・グローバル人材</option>
          <option value="sanctions-export">制裁・輸出管理</option>
          <option value="fintech-regulation">FinTech規制</option>
        </optgroup>
        <optgroup label="法務・判例">
          <option value="corporate-litigation">会社法・判例</option>
          <option value="ip-standards">知的財産・標準</option>
          <option value="law-firm">法律事務所</option>
        </optgroup>
        <optgroup label="スタートアップ・VC">
          <option value="vc-startup-docs">VC・スタートアップ標準ドキュメント</option>
          <option value="startup-legal">スタートアップ法務</option>
          <option value="startup-resource">スタートアップリソース</option>
        </optgroup>
        <optgroup label="ニュース・調査">
          <option value="legal-news">法律ニュース</option>
          <option value="research-data">データベース・調査</option>
        </optgroup>
      </select>
    </section>

    <!-- 記事一覧 -->
    <section class="articles-section">
      <h2>要約済み記事</h2>
      <div id="articles" class="articles-grid">
        <p class="loading">読み込み中...</p>
      </div>
      <div id="pagination" class="pagination"></div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>Startup Legal Summarizer - 米国スタートアップ法務情報を自動収集・要約</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
